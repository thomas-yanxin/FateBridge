minimum_pre_commit_version: '4.0.0'
default_install_hook_types: [pre-commit]
default_stages: [pre-commit, manual]

# Run the same uv-managed tools in Git hooks and CI.
repos:
  - repo: local
    hooks:
      - id: check-json
        name: Check JSON syntax
        entry: uv run --extra dev check-json --
        language: system
        types: [json]
      - id: check-yaml
        name: Check YAML syntax
        entry: uv run --extra dev check-yaml --allow-multiple-documents --
        language: system
        types: [yaml]
      - id: check-toml
        name: Check TOML syntax
        entry: uv run --extra dev check-toml --
        language: system
        types: [toml]
      - id: check-merge-conflict
        name: Check merge conflict markers
        entry: uv run --extra dev check-merge-conflict --assume-in-merge --
        language: system
        types: [text]
      - id: detect-private-key
        name: Detect private key markers
        entry: uv run --extra dev detect-private-key --
        language: system
        types: [text]
      - id: check-added-large-files
        name: Check file sizes (10 MiB limit)
        entry: uv run --extra dev check-added-large-files --maxkb=10240 --enforce-all --
        language: system
        # Existing bundled ephemerides exceed the limit by design.
        exclude: >-
          (?x)^src/fatebridge/data/astronomy/(?:
            de440-solar-record-atlas-v1\.bin\.gz|
            de441-planetary-0001-9999-v4-part-(?:0[0-9]|1[0-3])\.bin\.gz
          )$
      - id: trailing-whitespace
        name: Trim trailing whitespace in source and configuration
        entry: uv run --extra dev trailing-whitespace-fixer --
        language: system
        files: &maintained_text >-
          (?x)^(?:
            (?:src/fatebridge|scripts|tests)/.*\.pyi?|
            \.github/workflows/.*\.ya?ml|\.pre-commit-config\.yaml|pyproject\.toml
          )$
      - id: end-of-file-fixer
        name: Normalize final newline in source and configuration
        entry: uv run --extra dev end-of-file-fixer --
        language: system
        files: *maintained_text
      - id: isort
        name: Check Python import order
        entry: uv run --extra dev isort --check-only --
        language: system
        files: &python_sources ^(?:src/fatebridge|scripts|tests)/.*\.pyi?$
        require_serial: true
      - id: black
        name: Check Python formatting
        entry: uv run --extra dev black --check --
        language: system
        files: *python_sources
        require_serial: true
      - id: mypy
        name: Check FateBridge types
        entry: uv run --extra dev mypy src/fatebridge/
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      - id: codex-call-contracts
        name: Check generated call contracts
        entry: uv run --extra dev python scripts/build_codex_call_contracts.py --check
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
