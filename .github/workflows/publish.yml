name: Publish to PyPI

# Publishes new versions after master push CI succeeds, or on a GitHub Release,
# then creates the matching GitHub tag and Release after the PyPI upload succeeds.
# PyPI Trusted Publishing must trust this repository, publish.yml and the pypi
# environment. No API token is needed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

# Serialize the version check and upload across both entry points. A release
# must not cancel another upload, or race a master run for the same version.
concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event_name == 'release' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout the release or CI-tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check package version against PyPI
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_pypi_release.py

  build:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          # setuptools reads __version__ from source (static), but keep full
          # history so any future switch to a git-tag version scheme works.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build --no-sources

      - name: Verify metadata and long-description rendering
        run: uvx --from twine twine check dist/*

      - name: Assert reference data is packaged
        # Guards the exact bug this workflow was born with: a wheel that omits
        # fatebridge/data/**/*.json installs but crashes at runtime.
        run: |
          python - <<'PY'
          import glob, zipfile
          from pathlib import Path
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          expected = {
              path.relative_to("src").as_posix()
              for path in Path("src/fatebridge").rglob("*")
              if path.is_file() and (path.suffix in {".py", ".json"} or path.name == "py.typed")
          }
          actual = {name for name in names if name.startswith("fatebridge/")}
          assert actual == expected, {"missing": expected - actual, "extra": actual - expected}
          jsons = [n for n in names if n.endswith(".json") and "/data/" in n]
          assert jsons, f"no data JSON in wheel {wheel} — package-data missing"
          assert any(n.endswith("py.typed") for n in names), "py.typed missing"
          print(f"OK: {len(jsons)} data JSON files + py.typed present in wheel")
          PY

      - name: Verify installed wheel outside the checkout
        run: |
          uv venv --python 3.12 /tmp/fatebridge-wheel-test
          uv pip install --python /tmp/fatebridge-wheel-test/bin/python dist/*.whl
          cd /tmp
          /tmp/fatebridge-wheel-test/bin/fatebridge doctor --mcp --scenario onda-shiye
          /tmp/fatebridge-wheel-test/bin/python - <<'PY'
          from fastapi.testclient import TestClient
          from fatebridge import __version__
          from fatebridge.api import app
          from fatebridge.services.tool_catalog import CATALOG
          with TestClient(app) as client:
              assert client.get("/health").json() == {"status": "healthy"}
              assert client.get("/openapi.json").json()["info"]["version"] == __version__
              response = client.post("/api/cn/bazi/birth", params={
                  "fields": "bazi_birth.day_master", "strict_fields": "true",
              }, json={
                  "birth_year": 1990, "birth_month": 5, "birth_day": 15,
                  "birth_hour": 10, "birth_minute": 30, "gender": "男",
                  "birth_place": "北京", "birth_timezone": "Asia/Shanghai",
              })
              assert response.status_code == 200, response.text
              assert response.json()["run_metadata"]["package_version"] == __version__
              assert response.json()["bazi_birth"]["day_master"]
          print(f"Installed wheel OK: {__version__}, {len(CATALOG)} catalog records")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    needs: [check, publish]
    # Existing PyPI versions must never be tagged at a later master commit.
    # Failed-job retries retain the successful check/publish outputs.
    if: needs.check.outputs.should_publish == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout the published commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create the matching tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.check.outputs.version }}
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: >-
          python scripts/sync_github_release.py
          --version "$PACKAGE_VERSION" --sha "$PUBLISHED_SHA"
