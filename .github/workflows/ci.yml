name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      full_tests: ${{ steps.scope.outputs.full_tests }}
    steps:
      - name: Checkout repository and comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the complete change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_scope.py --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

  locked:
    needs: scope
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Check and install the locked development environment
        run: |
          uv lock --check
          uv sync --locked --extra dev

      - name: Verify installed commands and real stdio MCP
        if: needs.scope.outputs.full_tests == 'true'
        run: |
          uv run --locked --extra dev fatebridge doctor --mcp --scenario onda-shiye
          uv run --locked --extra dev python -m pytest -q tests/test_cli.py tests/test_api_alignment.py

      - name: Check documentation
        run: uv run --locked --extra dev python scripts/check_docs.py

      - name: Validate documentation contracts and runnable examples
        if: needs.scope.outputs.full_tests == 'false'
        run: |
          uv run --locked --extra dev python scripts/build_scenario_manifest.py --check
          uv run --locked --extra dev python scripts/build_codex_call_contracts.py --check
          uv run --locked --extra dev python -m pytest -q \
            tests/test_documentation_integrity.py tests/test_doc_tool_counts.py \
            tests/test_skills_interface_contract.py tests/test_skills_engine_contract.py \
            tests/test_codex_call_contracts.py tests/test_ci_scope.py

  test:
    needs: scope
    if: needs.scope.outputs.full_tests == 'true'
    # 固定到 ubuntu-24.04（而非 ubuntu-latest）：golden 基线是平台相关的字节锁，
    # runner OS 升级会改变 libm/星历浮点，必须与基线冻结平台锁步。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Record resolved dependencies
        run: |
          uv pip list --system > resolved-dependencies.txt
          cat resolved-dependencies.txt

      - name: Run tests
        run: pytest -q --junitxml=pytest-results.xml

      - name: Check formatting
        if: matrix.python-version == '3.12'
        run: black --check src/fatebridge scripts tests

      - name: Check import order
        if: matrix.python-version == '3.12'
        run: isort --check-only src/fatebridge scripts tests

      - name: Run type checks
        if: matrix.python-version == '3.12'
        run: mypy src/fatebridge/

      - name: Save regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-python-${{ matrix.python-version }}
          path: |
            resolved-dependencies.txt
            pytest-results.xml

  floor:
    needs: scope
    if: needs.scope.outputs.full_tests == 'true'
    # Install every direct dependency at its declared minimum so a too-low
    # version floor surfaces here instead of in a user's environment. The main
    # `test` job always resolves to the latest releases and would never catch it.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies at declared minimums
        run: uv pip install --system --resolution lowest-direct -e ".[dev]"

      - name: Record lowest-direct dependencies
        run: |
          uv pip list --system > resolved-dependencies.txt
          cat resolved-dependencies.txt

      - name: Run tests
        # 最低依赖版本的星历输出与「最新版」基线不同口径，关闭 golden 字节比对；
        # floor 只为守 API 下限，数值锁由 test 作业负责。
        env:
          FATEBRIDGE_SKIP_GOLDEN_DIFF: "1"
        run: pytest -q --junitxml=pytest-results.xml

      - name: Save lowest-direct regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-lowest-direct-python-3.10
          path: |
            resolved-dependencies.txt
            pytest-results.xml

  windows:
    needs: scope
    if: needs.scope.outputs.full_tests == 'true'
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Install the locked development environment
        run: uv sync --locked --extra dev
      - name: Verify Windows startup and independent stdio MCP
        run: uv run --locked --extra dev fatebridge doctor --mcp --scenario onda-shiye
      - name: Check private storage, kernel locks and transport repairs on Windows
        if: ${{ !cancelled() }}
        run: >-
          uv run --locked --extra dev python -m pytest -q
          tests/test_private_files.py tests/test_result_delivery.py
          tests/test_result_delivery_storage.py tests/test_coordinates.py
          tests/test_life_dimensions.py tests/test_coordinate_and_calendar_transports.py
          tests/test_calendar_helper_tools.py tests/test_fetch_ephe.py
          tests/test_scenario_dependency_closure.py
      - name: Check doctor diagnostics on Windows
        if: ${{ !cancelled() }}
        run: uv run --locked --extra dev python -m pytest -q tests/test_codex_experience.py -k doctor

  ci:
    name: CI result
    if: always()
    needs: [scope, locked, test, floor, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected checks to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          LOCKED_RESULT: ${{ needs.locked.result }}
          FULL_TESTS: ${{ needs.scope.outputs.full_tests }}
          TEST_RESULT: ${{ needs.test.result }}
          FLOOR_RESULT: ${{ needs.floor.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$LOCKED_RESULT" = success
          case "$FULL_TESTS" in
            true)
              test "$TEST_RESULT" = success
              test "$FLOOR_RESULT" = success
              test "$WINDOWS_RESULT" = success
              ;;
            false)
              test "$TEST_RESULT" = skipped
              test "$FLOOR_RESULT" = skipped
              test "$WINDOWS_RESULT" = skipped
              ;;
            *) exit 1 ;;
          esac
