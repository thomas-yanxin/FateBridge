name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# PR updates replace obsolete work. Every main/master push has a unique group,
# so neither running nor queued release-branch commits can replace one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      checks: ${{ steps.paths.outputs.code == 'true' || steps.paths.outputs.reference == 'true' }}
    steps:
      - name: Checkout push history for path filtering
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
      - name: Filter passive documentation changes
        id: paths
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!README*.md'
              - '!docs/**/*.md'
            reference:
              - 'docs/interpretation/**'

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-suffix: py3.12-dev
          cache-dependency-glob: pyproject.toml
          save-cache: false
      - name: Check documentation links, examples and published tool coverage
        run: |
          uv run --extra dev python scripts/check_docs.py
          uv run --extra dev python -m pytest -q tests/quality/test_documentation_integrity.py tests/quality/test_doc_tool_counts.py

  quality:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-suffix: py3.12-dev
          cache-dependency-glob: pyproject.toml
      - name: Install the development environment
        run: uv sync --extra dev
      - name: Restore incremental formatter and type-check caches
        uses: actions/cache@v4
        with:
          path: |
            .mypy_cache
            ~/.cache/black
          key: quality-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('src/**/*.py', 'scripts/**/*.py', 'tests/**/*.py') }}
          restore-keys: |
            quality-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}-
      - name: Check repository files, formatting, types and generated contracts
        run: |
          uv run --extra dev pre-commit run --hook-stage manual --all-files --show-diff-on-failure
          uv run --extra dev mypy src/fatebridge/ scripts/

  test:
    name: Tests (${{ matrix.environment.python }}, ${{ matrix.environment.os }}, ${{ matrix.environment.resolution }})
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ${{ matrix.environment.os }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          - {python: "3.10", os: ubuntu-24.04, resolution: lowest-direct}
          - {python: "3.12", os: ubuntu-24.04, resolution: highest}
          - {python: "3.13", os: ubuntu-24.04, resolution: highest}
          - {python: "3.12", os: windows-2022, resolution: highest}
    env:
      PYTHONUTF8: "1"
      CI_RESOLUTION: ${{ matrix.environment.resolution }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.environment.python }}
      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          save-cache: true
          cache-suffix: py${{ matrix.environment.python }}-${{ matrix.environment.resolution }}
          cache-dependency-glob: pyproject.toml
      - name: Install dependencies
        run: uv pip install --system --resolution "$CI_RESOLUTION" -e ".[dev]"
      - name: Verify installed CLI and independent stdio MCP
        if: matrix.environment.os == 'ubuntu-24.04' && matrix.environment.python == '3.12' && matrix.environment.resolution == 'highest'
        run: fatebridge doctor --mcp --family bazi
      - name: Run self-contained checks
        run: python scripts/run_ci_checks.py --junitxml=pytest-results.xml --durations=20 -n auto --maxprocesses=4 --dist worksteal
      - name: Save test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.environment.os }}-py${{ matrix.environment.python }}-${{ matrix.environment.resolution }}-attempt${{ github.run_attempt }}
          retention-days: 14
          path: pytest-results.xml

  ci:
    name: CI result
    if: always()
    needs: [changes, documentation, quality, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected job to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          CHECKS_REQUIRED: ${{ needs.changes.outputs.checks }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$DOCUMENTATION_RESULT" = success
          if [ "$CHECKS_REQUIRED" = true ]; then
            test "$QUALITY_RESULT" = success
            test "$TEST_RESULT" = success
          elif [ "$CHECKS_REQUIRED" = false ]; then
            test "$QUALITY_RESULT" = skipped
            test "$TEST_RESULT" = skipped
            echo "Documentation checks passed; heavy runtime checks not required."
          else
            exit 1
          fi
