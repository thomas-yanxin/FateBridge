name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# PR updates replace obsolete work. Every main/master push has a unique group,
# so neither running nor queued release-branch commits can replace one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      checks: ${{ steps.paths.outputs.code == 'true' || steps.paths.outputs.scenario == 'true' }}
    steps:
      - name: Checkout push history for path filtering
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
      - name: Filter passive documentation changes
        id: paths
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!README*.md'
              - '!docs/**/*.md'
            scenario:
              - 'docs/scenario-routing.md'

  locked:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-suffix: py3.12-locked
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Check and install the locked development environment
        run: |
          uv lock --check
          uv sync --locked --extra dev
      - name: Verify installed commands and real stdio MCP
        run: |
          uv run --locked --extra dev fatebridge doctor --mcp --scenario onda-shiye
          uv run --locked --extra dev python -m pytest -q tests/integration/test_cli.py tests/integration/test_api_alignment.py -n auto --maxprocesses=4 --dist worksteal

  quality:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          save-cache: false
          cache-suffix: py3.12-locked
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install the locked development environment
        run: uv sync --locked --extra dev
      - name: Restore incremental formatter and type-check caches
        uses: actions/cache@v4
        with:
          path: |
            .mypy_cache
            ~/.cache/black
          key: quality-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ hashFiles('src/**/*.py', 'scripts/**/*.py', 'tests/**/*.py') }}
          restore-keys: |
            quality-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
      - name: Check formatting
        run: uv run --locked --extra dev black --check src/fatebridge scripts tests
      - name: Check import order
        run: uv run --locked --extra dev isort --check-only src/fatebridge scripts tests
      - name: Run type checks
        run: uv run --locked --extra dev mypy src/fatebridge/
      - name: Check documentation
        run: uv run --locked --extra dev python scripts/check_docs.py
      - name: Check generated scenario and call contracts
        run: |
          uv run --locked --extra dev python scripts/build_scenario_manifest.py --check
          uv run --locked --extra dev python scripts/build_codex_call_contracts.py --check

  test:
    name: Tests (${{ matrix.environment.python }}, ${{ matrix.environment.os }}, ${{ matrix.environment.resolution }}, shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ${{ matrix.environment.os }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          - {python: "3.10", os: ubuntu-24.04, resolution: highest}
          - {python: "3.11", os: ubuntu-24.04, resolution: highest}
          - {python: "3.12", os: ubuntu-24.04, resolution: highest}
          - {python: "3.13", os: ubuntu-24.04, resolution: highest}
          - {python: "3.10", os: ubuntu-24.04, resolution: lowest-direct}
          - {python: "3.12", os: windows-2022, resolution: locked}
        shard: [0, 1, 2]
    env:
      PYTHONUTF8: "1"
      CI_ENVIRONMENT: ${{ matrix.environment.os }}-py${{ matrix.environment.python }}-${{ matrix.environment.resolution }}
      CI_SHARD: ${{ matrix.shard }}
      CI_RESOLUTION: ${{ matrix.environment.resolution }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.environment.python }}
      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          save-cache: ${{ matrix.shard == 0 }}
          cache-suffix: py${{ matrix.environment.python }}-${{ matrix.environment.resolution }}
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: |
          if [ "$CI_RESOLUTION" = locked ]; then
            uv sync --locked --extra dev
          else
            uv pip install --system --resolution "$CI_RESOLUTION" -e ".[dev]"
          fi
      - name: Record resolved dependencies
        env:
          UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        run: |
          echo "$UV_CACHE_HIT" > cache-status.txt
          python -c "import os; print('Runner logical CPUs:', os.cpu_count())"
          if [ "$CI_RESOLUTION" = locked ]; then
            uv pip list --python .venv > resolved-dependencies.txt
          else
            uv pip list --system > resolved-dependencies.txt
          fi
      - name: Verify Windows startup and independent stdio MCP
        if: runner.os == 'Windows' && matrix.shard == 0
        run: uv run --locked --extra dev fatebridge doctor --mcp --scenario onda-shiye
      - name: Run self-contained checks
        run: |
          if [ "$CI_RESOLUTION" = locked ]; then
            uv run --locked --extra dev python scripts/run_ci_checks.py \
              --shard-index "$CI_SHARD" --shard-count 3 \
              --environment-id "$CI_ENVIRONMENT" --selection-report ci-selection.json \
              --junitxml=pytest-results.xml --durations=20 -n auto --maxprocesses=4 --dist worksteal
          else
            python scripts/run_ci_checks.py \
              --shard-index "$CI_SHARD" --shard-count 3 \
              --environment-id "$CI_ENVIRONMENT" --selection-report ci-selection.json \
              --junitxml=pytest-results.xml --durations=20 -n auto --maxprocesses=4 --dist worksteal
          fi
      - name: Save regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ env.CI_ENVIRONMENT }}-${{ matrix.shard }}-attempt${{ github.run_attempt }}
          retention-days: 14
          path: |
            resolved-dependencies.txt
            pytest-results.xml
            ci-selection.json
            cache-status.txt

  ci:
    name: CI result
    if: always()
    needs: [changes, locked, quality, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected job to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_REQUIRED: ${{ needs.changes.outputs.checks }}
          LOCKED_RESULT: ${{ needs.locked.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$CHECKS_REQUIRED" = true ]; then
            test "$LOCKED_RESULT" = success
            test "$QUALITY_RESULT" = success
            test "$TEST_RESULT" = success
          elif [ "$CHECKS_REQUIRED" = false ]; then
            test "$LOCKED_RESULT" = skipped
            test "$QUALITY_RESULT" = skipped
            test "$TEST_RESULT" = skipped
            echo "Passive documentation only; no runtime checks required."
          else
            exit 1
          fi
      - name: Download shard coverage evidence
        if: needs.changes.outputs.checks == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: ci-*
          path: ci-evidence
      - name: Verify every collected test ran exactly once per environment
        if: needs.changes.outputs.checks == 'true'
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          latest = {}
          for path in Path("ci-evidence").glob("*/ci-selection.json"):
              report = json.loads(path.read_text(encoding="utf-8"))
              attempt = int(path.parent.name.rsplit("-attempt", 1)[1])
              key = (report["environment"], report["shard_index"])
              if key not in latest or attempt > latest[key][0]:
                  latest[key] = (attempt, report)
          assert len(latest) == 18, f"Expected 18 shard reports, found {len(latest)}"
          groups = defaultdict(list)
          for _, report in latest.values():
              groups[report["environment"]].append(report)
          assert len(groups) == 6, f"Expected six dependency/platform environments: {list(groups)}"
          for environment, reports in groups.items():
              assert sorted(r["shard_index"] for r in reports) == [0, 1, 2], environment
              assert all(r["shard_count"] == 3 for r in reports), environment
              collected = reports[0]["collected"]
              assert all(r["collected"] == collected for r in reports), environment
              selected = [node for r in reports for node in r["selected"]]
              assert len(selected) == len(set(selected)) == len(collected), environment
              assert set(selected) == set(collected), environment
              print(f"{environment}: {len(collected)} test nodes covered exactly once")
          PY
