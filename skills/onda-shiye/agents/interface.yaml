name: onda-shiye
version: 0.2.0
scenario: 事业与工作
summary: 围绕岗位、工作方向与创业角色，结合相关结构和时间变化，讨论现实选项与条件
consultation:
  kind: topic
  topics:
  - career
  scope: current_question
  time_selection: shared
  safety_policy: consultation_boundaries_v1
triggers:
- 事业
- 工作方向
- 岗位
- 晋升
- 跳槽
- 创业角色
engine_tools:
- analyze_destiny
- astro_chart
- astro_election
- bazi_career
- firdaria
- timing_analysis
- western_timing_analysis
- ziwei_birth
- ziwei_horoscope
required_inputs: []
input_notes:
- 按当前问题与所选工具实际 Schema 核对必要资料；不是完整问卷
- 主题、对象与时间范围沿用当前聊天，限定方法优先，缺项仅限制对应层
reads:
- ../../_shared/consultation-routing.md
- ../../_shared/safety-boundaries.md
- ../../_shared/fatebridge-engine.md
- ../../_shared/onda-counsel.md
- ../../_shared/timing-selection.md
output:
  kind: interpretation
  grounding: engine_fields
  voice: onda-counsel
boundary: 传统文化参考；禁止生死寿命、重大灾祸断言、临床诊断治疗与医疗择时；多工具不扩大本轮范围。
