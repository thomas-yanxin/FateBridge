name: onda-xingpan
version: 0.2.1
scenario: 命盘与指定方法解读
summary: 直接满足用户指定的命盘、流派与技法，按相关主题解释实际字段并保留精度范围
consultation:
  kind: service
  topics:
  - method
  scope: current_question
  time_selection: shared
  safety_policy: consultation_boundaries_v1
triggers:
- 人类图
- BodyGraph
- 星盘
- 八字命盘
- 紫微命盘
- 流派盘
- 关系盘
- 指定技法
- 河洛理数
- 邵子参评
- 金锁银匙
engine_tools:
- human_design
- astro_vimshottari
- analyze_destiny
- astro_chart
- astro_chart13
- astro_germany_chart
- astro_guolao_chart
- astro_hellen_chart
- astro_india_chart
- astro_relative_chart
- bazi_birth
- bazi_source_compare
- canping
- heluo
- dayun_analysis
- firdaria
- liunian_analysis
- western_timing_analysis
- ziwei_birth
- ziwei_horoscope
- ziwei_rules
dependencies:
- kind: shared_support
  tools:
  - knowledge_registry
  - knowledge_read
  condition: 需要查证内置传统知识或来源时；不自动新增个人计算
- kind: conditional_service
  scenario: onda-shiyun
  condition: 本轮询问阶段、年度、短期或指定时间技法时；只补未覆盖层，先遵守硬边界
required_inputs: []
input_notes:
- 核对已给出的原典命式可用 bazi_source_compare；只传明确字面四柱，不追造历史人物生日。参考编释不覆盖计算，差异、未知和未收录均保留，不能声称完整原典或现实验证通过
- 按当前问题与所选工具实际 Schema 核对必要资料；不是完整问卷
- 主题、对象与时间范围沿用当前聊天，限定方法优先，缺项仅限制对应层
reads:
- ../references/human-design.md
- ../references/numerology.md
- ../../_shared/consultation-core.md
- ../../_shared/vedic-evidence.md
- ../../_shared/consultation-routing.md
- ../../_shared/safety-boundaries.md
- ../../_shared/fatebridge-engine.md
- ../../_shared/onda-counsel.md
- ../../_shared/timing-selection.md
output:
  kind: interpretation
  grounding: engine_fields
  voice: onda-counsel
boundary: 传统文化参考；禁止生死寿命、重大灾祸断言、临床诊断治疗与医疗择时；多工具不扩大本轮范围。
license: Apache-2.0
