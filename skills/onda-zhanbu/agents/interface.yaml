name: onda-zhanbu
version: 0.2.0
scenario: 具体问事与占卜
summary: 仅在用户明确求卦或起局时处理具体事项，解释真实卦变与条件，复用同一问事结果
consultation:
  kind: service
  topics:
  - divination
  scope: current_question
  time_selection: shared
  safety_policy: consultation_boundaries_v1
triggers:
- 起卦
- 求卦
- 六爻
- 梅花
- 奇门
- 问事
engine_tools:
- astro_horary
- gua_lookup
- gua_meiyi
- jinkou
- liureng_gods
- liureng_runyear
- meihua_analysis
- otherbu
- qimen
- sanshiunited
- sixyao
- suzhan
- taiyi
- tongshefa
dependencies:
- kind: shared_support
  tools:
  - knowledge_registry
  - knowledge_read
  condition: 需要查证内置传统知识或来源时；不自动新增个人计算
required_inputs: []
input_notes:
- 按当前问题与所选工具实际 Schema 核对必要资料；不是完整问卷
- 主题、对象与时间范围沿用当前聊天，限定方法优先，缺项仅限制对应层
reads:
- ../../_shared/consultation-routing.md
- ../../_shared/safety-boundaries.md
- ../../_shared/fatebridge-engine.md
- ../../_shared/onda-counsel.md
- ../../_shared/timing-selection.md
output:
  kind: interpretation
  grounding: engine_fields
  voice: onda-counsel
boundary: 传统文化参考；禁止生死寿命、重大灾祸断言、临床诊断治疗与医疗择时；多工具不扩大本轮范围。
license: Apache-2.0
