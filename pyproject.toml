# setuptools>=77 is required for the PEP 639 SPDX ``license``/``license-files``
# expression used below (older setuptools rejects the string form).
[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fatebridge"
# Single source of truth: src/fatebridge/__init__.py::__version__. REST (api.py),
# MCP (mcp_server.py) and the packaging metadata all read that one value.
dynamic = ["version"]
description = "Local BaZi, Zi Wei, Western astrology, divination, and Feng Shui calculations for AI applications via MCP, REST API, and CLI"
authors = [{name = "thomas-yanxin", email = "yx20001210@163.com"}]
# PEP 639: SPDX expression + explicit license files (LICENSE + NOTICE, the
# latter required by Apache-2.0 §4d). The old ``License ::`` classifier is
# intentionally dropped — setuptools>=77 rejects it alongside an SPDX string.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.110.1",
    "fastmcp>=3.4.2",
    # The predictive adapter and numerical fixtures target Kerykeion 5.
    # Version 6 changes return calculations and bundled ephemeris data layout.
    "kerykeion>=5.5.0,<6",
    "lunardate>=0.2.2",
    "mpmath==1.3.0",
    "packaging>=23.0",  # doctor checks installed dependency version constraints
    "pydantic>=2.0.0",
    "pygeomag==1.1.0",
    "pyswisseph>=2.10.0",
    "python-dateutil>=2.8.0",
    "python-multipart>=0.0.9",
    "pytz>=2025.2",
    "pywin32>=306 ; sys_platform == 'win32'",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.20.0",  # validate published output contracts in transport tests
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pyyaml>=6.0",  # test_skills_interface_contract parses agents/interface.yaml
    "opencc-python-reimplemented==0.1.7",  # place-catalog importer only; no runtime dependency
    "pyerfa>=2.0.1.5,<3",
    "jplephem>=2.24,<3",
]
jpl = [
    "jplephem>=2.24,<3",
    "pyerfa>=2.0.1.5,<3",
]

[project.urls]
Homepage = "https://github.com/thomas-yanxin/FateBridge"
Repository = "https://github.com/thomas-yanxin/FateBridge"
Issues = "https://github.com/thomas-yanxin/FateBridge/issues"
Changelog = "https://github.com/thomas-yanxin/FateBridge/blob/master/CHANGELOG.md"

[project.scripts]
fatebridge = "fatebridge.cli:main"
fatebridge-api = "fatebridge.api:main"
fatebridge-mcp = "fatebridge.mcp_server:main"

[tool.setuptools.dynamic]
version = {attr = "fatebridge.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fatebridge*"]

# packages.find discovers *code* only. The engines load their reference data at
# runtime via ``Path(__file__).parents[1] / "data" / ...`` (canping, heluo,
# knowledge_store), so the JSON payloads MUST be declared here or an installed
# wheel raises FileNotFoundError. ``py.typed`` ships the PEP 561 typed marker.
[tool.setuptools.package-data]
fatebridge = ["py.typed", "data/**/*.json", "data/guolao/sefstars.txt", "data/western_stars/sefstars.txt", "data/astronomy/erfa-license.txt", "data/astronomy/vsop2013/*.c", "data/astronomy/vsop2013/*.S", "data/astronomy/vsop2013/*.in", "data/astronomy/*.bin.gz", "data/knowledge/iers-c04-ut1-v1.json.gz", "data/knowledge/iers-c04-LICENSE.txt", "data/sukuyo_dayan_reference_LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "native_engine_fault: inject a fault or spy inside a fresh native-engine test process",
    "local_data: requires locally archived regression or independent reference data",
]

[tool.black]
line-length = 88
target-version = ['py310']
# Frozen programs are byte-checked regression inputs, not maintained code.
extend-exclude = '^/tests/fixtures/'

[tool.isort]
profile = "black"
multi_line_output = 3
extend_skip_glob = ["tests/fixtures/**"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "dateutil",
    "dateutil.*",
    "fastmcp",
    "fastmcp.*",
    "kerykeion",
    "lunardate",
    "lunardate.*",
    "pytz",
    "swisseph",
    "yaml",
    "win32api",
    "win32con",
    "win32file",
    "win32security",
    "pywintypes",
    "ntsecuritycon",
]
ignore_missing_imports = true
